<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>OJT Progress Tracker</title>

  <link rel="stylesheet" href="style.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="header">
    <h1>OJT Progress Tracker</h1>
  </header>

  <main class="container">

    <!-- DASHBOARD -->
    <section class="dashboard">

      <div class="card total">
        <h2 id="statTotal">0</h2>
        <p>Total Tasks</p>
      </div>

      <div class="card pending">
        <h2 id="statPending">0</h2>
        <p>Pending</p>
      </div>

      <div class="card progress">
        <h2 id="statProgress">0</h2>
        <p>In Progress</p>
      </div>

      <div class="card completed">
        <h2 id="statDone">0</h2>
        <p>Completed</p>
      </div>

    </section>

    <!-- PROGRESS BAR -->
    <section class="progress-section">

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p id="progressPct">0% Completed</p>

    </section>

    <!-- TASK FORM -->
    <section class="task-form">

      <h2>Add Daily Learning Task</h2>

      <input type="text" id="taskTitle" placeholder="Task Title">

      <input type="date" id="taskDate">

      <select id="taskCategory">
        <option>Development</option>
        <option>Research</option>
        <option>Testing</option>
        <option>Documentation</option>
      </select>

      <select id="taskStatus">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select>

      <button id="addTaskBtn">Add Task</button>

    </section>

    <!-- TASK LIST -->
    <section id="taskList" class="task-list"></section>

    <!-- NOTES -->
    <section class="notes-section">

      <h2>Daily Notes</h2>

      <textarea
        id="learningNotes"
        placeholder="Learnings">
      </textarea>

      <textarea
        id="errorNotes"
        placeholder="Errors">
      </textarea>

      <textarea
        id="feedbackNotes"
        placeholder="Mentor Feedback">
      </textarea>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
